name: Release

# Publishing a GitHub release builds signed universal and ABI-specific APKs.
# The app version comes from the tag (v1.2.3 becomes 1.2.3), so a release can never disagree with
# what the app reports about itself.
#
# Retry an existing release with the latest workflow fixes without moving its
# tag: gh workflow run release.yml --ref main -f release_tag=<tag>
# App sources always come from that tag. Release scripts come from the workflow
# revision. Without release_tag, dispatch on the tag itself as before.

on:
  push:
    branches: [test]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild
        required: false
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/{0}', env.RELEASE_TAG) }}

      - name: Check out release scripts from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-workflow
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Build remote UI assets
        working-directory: app
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm run build

      - name: Restore the signing identity
        id: signing
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Android upload keystore configured; building a debug-signed APK for testing only. It will not be attached to the GitHub release."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          if ! keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The decoded Android keystore is invalid or its store password/key alias does not match. Recreate ANDROID_KEYSTORE_BASE64 from the original upload keystore and verify the related signing secrets."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build the signed APKs
        working-directory: app
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1)"
          fi
          # The build number comes from pubspec.yaml, NOT the workflow run
          # counter: dev builds side-loaded during testing carry the pubspec
          # number, and a release with a lower versionCode is a downgrade
          # Android refuses to install over them.
          BUILD_NUMBER="$(sed -n 's/^version:.*+//p' pubspec.yaml)"
          flutter pub get
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            flutter test
          fi
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"
          python3 ../.release-workflow/.github/scripts/check_apks.py \
            build/app/outputs/flutter-apk "$VERSION" "$BUILD_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "kiosk-satellite-${RELEASE_TAG}.apk"
          for ABI in armeabi-v7a arm64-v8a x86_64; do
            mv "build/app/outputs/flutter-apk/app-${ABI}-release.apk" \
               "kiosk-satellite-${RELEASE_TAG}.${ABI}.apk"
          done

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-satellite-${{ env.RELEASE_TAG }}-apk
          path: app/kiosk-satellite-${{ env.RELEASE_TAG }}*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Attach the APKs to the release
        if: >-
          steps.signing.outputs.signed == 'true' &&
          (github.event_name == 'release' || github.ref_type == 'tag' || inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .release-workflow/.github/scripts/publish_apks.py "$RELEASE_TAG" app
